[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-2048-platform"
version = "0.1.0"
description = "2048 RL 训练实验平台 MVP (Gymnasium env + DQN + TensorBoard)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
