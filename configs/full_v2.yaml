# full_v2 配置：奖励重塑 + 更大网络 + 更长训练，目标冲击 max_tile 1024。
# 建议先跑 full_v2_smoke 通过后再执行本配置。
total_steps: 600000
learning_starts: 10000
train_freq: 4
target_update_interval: 5000

lr: 0.0001
gamma: 0.995
batch_size: 128
buffer_size: 200000
hidden_sizes: [512, 512, 256]

eps_start: 1.0
eps_end: 0.05
eps_decay_steps: 400000

log_dir: runs
save_every: 50000
eval_every: 50000
eval_episodes: 50

max_steps: 10000
illegal_penalty: -0.1
merge_reward_scale: 0.05
reward_empty_coef: 0.15
reward_new_max_bonus: 8.0
reward_milestones:
  128: 2
  256: 8
  512: 25
  1024: 80

seed: 42
device: auto
run_name: full_v2
